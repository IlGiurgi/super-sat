name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S vst3 -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign (ad-hoc) and zip
        run: |
          VST=$(find build -maxdepth 4 -name "*.vst3" -type d | head -1)
          echo "Found: $VST"
          codesign --force --deep -s - "$VST"
          mkdir -p out
          ditto -c -k --keepParent "$VST" out/SuperSat-mac-vst3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuperSat-mac-vst3
          path: out/SuperSat-mac-vst3.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S vst3 -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Zip
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Select-Object -First 1
          Write-Host "Found: $($vst.FullName)"
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path $vst.FullName -DestinationPath out/SuperSat-win-vst3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuperSat-win-vst3
          path: out/SuperSat-win-vst3.zip
