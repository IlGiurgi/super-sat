name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S vst3 -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign (ad-hoc), zip and build installer
        run: |
          VST=$(find build -maxdepth 5 -name "*.vst3" -type d | head -1)
          AU=$(find build -maxdepth 5 -name "*.component" -type d | head -1)
          APP=$(find build -maxdepth 5 -name "*.app" -type d | head -1)
          echo "VST3: $VST"; echo "AU: $AU"; echo "APP: $APP"
          for b in "$VST" "$AU" "$APP"; do [ -n "$b" ] && codesign --force --deep -s - "$b"; done
          mkdir -p out stage/Library/Audio/Plug-Ins/VST3 stage/Library/Audio/Plug-Ins/Components stage/Applications
          cp -R "$VST" stage/Library/Audio/Plug-Ins/VST3/
          [ -n "$AU" ] && cp -R "$AU" stage/Library/Audio/Plug-Ins/Components/
          [ -n "$APP" ] && cp -R "$APP" "stage/Applications/"
          # installer .pkg: mette i plugin nelle cartelle giuste
          pkgbuild --root stage --identifier com.supersat.plugin --version 1.0.0 \
                   --install-location / out/SuperSat-Mac-Installer.pkg
          # zip dei singoli file
          ditto -c -k --keepParent "$VST" out/SuperSat-mac-vst3.zip
          [ -n "$AU" ] && ditto -c -k --keepParent "$AU" out/SuperSat-mac-au.zip || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SuperSat-mac
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S vst3 -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Zip
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Select-Object -First 1
          Write-Host "Found: $($vst.FullName)"
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path $vst.FullName -DestinationPath out/SuperSat-win-vst3.zip
          $exe = Get-ChildItem build -Recurse -Filter "Super Sat.exe" | Select-Object -First 1
          Write-Host "Standalone: $($exe.FullName)"
          Compress-Archive -Path $exe.FullName -DestinationPath out/SuperSat-win-standalone.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuperSat-win
          path: out/*.zip
